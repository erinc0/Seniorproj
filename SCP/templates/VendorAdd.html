<!DOCTYPE html>
<html lang="en">
<head>
    <style>
input[type="checkbox"]{
    transform: scale(.5);
float: right;
    display: flex;
}
.checkbox-label{
    display: flex;
    align-items: center;
}

    </style>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
    <title>VendorAdd</title>
</head>
<body>

<nav style>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links" style="float: right">
            <li><a href="{{url_for('Vhomepage')}}">Back to Home</a></li>
            <li><a href="{{ url_for('search')}}">Search</a></li>
            <li><a href="{{url_for('login')}}">Logout</a></li>
        </ul>
    </div>
</nav>


<h1 style="padding-top: 100px">New Listing</h1>
<main>
    <hr>
    <form action="{{ url_for('VendorAdd') }}" method="post" enctype="multipart/form-data">

        <label>Name:<br>
		<input type="text" name="name" required><br><br>
        </label>
		<label>Price:<br>
		<input type="number" name="price" min="0.01" step="0.01" max="2500" /><br><br>
        </label>
		<label>Quantity: <br>
		<input type="number" name="quantity" min="1" step="1" max="1500" value=""/><br><br>
        </label>
        <label>Category:<br>
        <select name="category" required>
            <option value="CPU">CPU</option>
            <option value="GPU">GPU</option>
            <option value="APU">APU</option>
            <option value="Motherboard">Motherboard</option>
            <option value="RAM">RAM</option>
            <option value="HDD">HDD</option>
            <option value="SSD">SSD</option>
            <option value="NVMe">NVMe</option>
            <option value="PSU">PSU</option>
            <option value="Air Coolers">Air Coolers</option>
            <option value="Liquid Coolers">Liquid Coolers</option>
            <option value="PC Cases">PC Cases</option>
            <option value="Memory">Memory</option>
            <option value="Optical Drives">Optical Drives</option>
            <option value="Sound Cards">Sound Cards</option>
            <option value="Network Cards">Network Cards</option>
            <option value="Keyboard">Keyboard</option>
            <option value="Mouse">Mouse</option>
            <option value="Monitor">Monitor</option>
            <option value="Speakers">Speakers</option>
            <option value="Expansion Cards">Expansion Cards</option>
            <option value="Cables and Connectors">Cables and Connectors</option>
        </select><br><br>
		<label>Shipping Options:</label><br><br>
            USPS Ground Advantage<input type="checkbox" name="shipping" value="1" checked> <br>
            USPS Priority Mail<input type="checkbox" name="shipping" value="2"> <br>
            USPS Priority Mail Express<input type="checkbox" name="shipping" value="3">  <br>
            UPS Ground<input type="checkbox" name="shipping" value="4"> <br>
            UPS 2nd Day Air<input type="checkbox" name="shipping" value="5"> <br>
            UPS Next Day Air<input type="checkbox" name="shipping" value="6"> <br>
            FedEx Ground<input type="checkbox" name="shipping" value="7"> <br>
            FedEx 2Day<input type="checkbox" name="shipping" value="8"><br>
            FedEx Standard Overnight	<input type="checkbox" name="shipping" value="9"> <br>
        </label>
		<label>Image:<br>
        <input style="height: 45px" type="file" name="file" formenctype="multipart/form-data"/>
        </label>
		<label> Description: <br>
		<textarea name="description" rows="4" cols ="40"></textarea>
    <button type="submit">Submit</button>
        </label>
	</form>
</main>
</body>
</html>
