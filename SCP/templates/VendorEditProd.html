<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
</head>
<nav style>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links">
            <li><a href="{{ url_for('search')}}">Search</a></li>
            <li><a href="{{url_for('Vhomepage')}}">Home</a></li>
            <li><a href="{{url_for('login')}}">Logout</a></li>
        </ul>
    </div>
</nav>
<body>
<h1 style="padding-top: 100px">Edit Product</h1>


<form action="{{ url_for('update_product', product_id=product['ProductID']) }}" method="post" enctype="multipart/form-data">
    <label>Title:<br>
        <input type="text" name="name" value="{{ product['ProdName'] }}"><br><br>
    </label>
    <label>Price:<br>
        <input type="number" name="price" step="0.01" value="{{ product['ProdPrice'] }}"><br><br>
    </label>
    <label>Quantity:<br>
        <input type="number" name="quantity" value="{{ product['ProdQuantity'] }}"><br><br>
    </label>
    <label>Description:<br>
        <textarea name="description">{{ product['ProdDesc'] }}</textarea><br><br>
    </label>
    <label>Image:<br>
        <input type="file" name="image" accept="image/*"><br><br>
    </label>
    <button type="submit">Update</button>
</form>

<!-- so much timeee-->
<form action="{{ url_for('delete_product', product_id=product['ProductID']) }}" method="post" onsubmit="return confirmDelete(this);">

    <button type="submit" style="background-color: red; color: white;">Delete Product</button>
</form>

<div id="confirm-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(3px); z-index:9998;"></div>

<div id="confirm-box" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; border:2px solid black; padding:25px 40px; z-index:9999; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); border-radius:10px; max-width: 400px;">
    <p id="confirm-message" style="margin-bottom: 20px; font-size: 16px;">Are you sure you want to delete this product?</p>
    <button onclick="confirmYes()" style="background-color:#dc3545; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; margin-right:10px;">Yes</button>
    <button onclick="confirmNo()" style="background-color:#007BFF; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">No</button>
</div>
<script>
    let confirmForm = null;

    function confirmDelete(form) {
        confirmForm = form;
        document.getElementById('confirm-box').style.display = 'block';
        document.getElementById('confirm-overlay').style.display = 'block';
        return false; // prevent default form submission
    }

    function confirmYes() {
        document.getElementById('confirm-box').style.display = 'none';
        document.getElementById('confirm-overlay').style.display = 'none';
        if (confirmForm) confirmForm.submit();
    }

    function confirmNo() {
        document.getElementById('confirm-box').style.display = 'none';
        document.getElementById('confirm-overlay').style.display = 'none';
        confirmForm = null;
    }
</script>

</body>
</html>
