<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PC Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='homespcbuilder.css') }}">
  <style>
    body {
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .pc-container {
      position: relative;
      width: 768px;
      margin: 40px auto;
    }
    .pc-image {
      width: 100%;
    }
    .part-box {
      position: absolute;
      border: 2px solid gray;
      background-color: rgba(128, 128, 128, 0.6);
      transition: 0.3s;
      cursor: pointer;
    }
    .part-box:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .label {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      color: white;
      text-align: center;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .tooltip {
      position: absolute;
      background-color: black;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      visibility: hidden;
      z-index: 10;
    }
    .part-box:hover .tooltip {
      visibility: visible;
    }
    .result-item {
      margin-top: 10px;
      padding: 10px;
      border-top: 1px solid #ccc;
      text-align: left;
    }
    .result-item button {
      padding: 5px 10px;
      background-color: #1f4291;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .result-item button:hover {
      background-color: #163172;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-content">
    <div class="logo">
      <img src="{{ url_for('static', filename='estation.webp') }}" alt="logo"
           style="width: 130px;height:70px; padding: 10px 4px;">
    </div>
    <ul class="nav-links" style="float: right">
      <li><a href="{{url_for('Bhomepage')}}">Back to Home</a></li>
      <li><a href="{{ url_for('search')}}">Search</a></li>
      <li><a href="{{url_for('login')}}">Logout</a></li>
    </ul>
  </div>
</nav>

<h1 style="color: black; padding-top: 80px;">Build Your PC</h1>

<div class="pc-container">
  <img src="{{ url_for('static', filename='pcbuild.png') }}" class="pc-image" alt="PC Image" />

  <div class="part-box" id="box_cpu" onclick="loadCategory(['CPU'])" style="top: 185px; left: 230px; width: 80px; height: 80px;">
    <div class="label">CPU</div>
    <div class="tooltip">Click me to browse CPUs</div>
  </div>

  <div class="part-box" id="box_ram" onclick="loadCategory(['RAM'])" style="top: 170px; left: 340px; width: 40px; height: 110px;">
    <div class="label">RAM</div>
    <div class="tooltip">Click me to browse RAM</div>
  </div>

  <div class="part-box" id="box_gpu" onclick="loadCategory(['GPU'])" style="top: 360px; left: 80px; width: 400px; height: 70px;">
    <div class="label">GPU</div>
    <div class="tooltip">Click me to browse GPUs</div>
  </div>

  <div class="part-box" id="box_storage" onclick="loadCategory(['SSD', 'HDD', 'NVMe'])" style="top: 450px; left: 170px; width: 200px; height: 40px;">
    <div class="label">Storage</div>
    <div class="tooltip">Click me to browse SSD, HDD, NVMe</div>
  </div>

  <div class="part-box" id="box_motherboard" onclick="loadCategory(['Motherboard'])" style="top: 110px; left: 110px; width: 300px; height: 40px;">
    <div class="label">Motherboard</div>
    <div class="tooltip">Click me to browse Motherboards</div>
  </div>

  <div class="part-box" id="box_psu" onclick="loadCategory(['PSU'])" style="top: 600px; left: 140px; width: 160px; height: 80px;">
    <div class="label">PSU</div>
    <div class="tooltip">Click me to browse PSUs</div>
  </div>

  <div class="part-box" id="box_pc_cases" onclick="loadCategory(['PC Cases'])" style="top: 300px; left: 700px; width: 100px; height: 100px;">
    <div class="label">Case</div>
    <div class="tooltip">Click me to browse PC Cases</div>
  </div>
</div>

<div id="selected-labels" style="margin-top: 20px;">
  <p id="label_cpu"></p>
  <p id="label_ram"></p>
  <p id="label_gpu"></p>
  <p id="label_storage"></p>
  <p id="label_motherboard"></p>
  <p id="label_psu"></p>
  <p id="label_pc_cases"></p>
</div>

<div id="part-results" style="width: 80%; margin: 20px auto; text-align: left;"></div>

<script>
  const buildSelections = {};

  function addToBuild(category, product) {
  let displayCategory = category;

  // Normalize SSD, HDD, NVMe to 'Storage' for UI mapping
  if (["SSD", "HDD", "NVMe"].includes(category)) {
    displayCategory = "Storage";
  }

  const idSafe = displayCategory.toLowerCase().replace(/ /g, "_");
  buildSelections[idSafe] = product;

  const partBox = document.getElementById(`box_${idSafe}`);
  if (partBox) partBox.style.display = "none";

  const label = document.getElementById(`label_${idSafe}`);
  if (label) {
    label.innerHTML = `<strong>${product.ProdName}</strong> added to build`;
  }
}
``

  function loadCategory(categories) {
  const resultDiv = document.getElementById("part-results");
  resultDiv.innerHTML = `<h2>${categories.join(", ")}</h2>`;

  fetch(`/searchS?search=`)
    .then(res => res.json())
    .then(data => {
      const filtered = data.filter(p => categories.includes(p.ProdCategory));

      if (filtered.length === 0) {
        resultDiv.innerHTML += "<p>No results found.</p>";
      } else {
        filtered.forEach(product => {
          resultDiv.innerHTML += `
            <div class="result-item">
              <img src="/get_product_image/${product.ProductID}" width="60" height="60" style="vertical-align: middle;" />
              <strong>${product.ProdName}</strong> - $${product.ProdPrice}
              <button onclick='addToBuild("${product.ProdCategory}", ${JSON.stringify(product).replace(/'/g, "&#39;")})'>Add to Build</button>
            </div>
          `;
        });
      }
    });
}

</script>

</body>
</html>
