<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Existing Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<nav>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='whiteversion.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links">
            <li><a href="{{ url_for('Vhomepage') }}">Home</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Search</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </div>
</nav>
<h2 style="justify-self: center; padding-top: 100px">Search Your Products</h2>
<div class="container2" style="padding-top: 10px">
    <div class="search-input">
        <div class="search-bar">
    <input type="text" id="search" placeholder="Search by product name">
    <button onclick="searchProducts()" style="width: 20%;
    padding: 10px;
    background-color: transparent;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 0px;
}"><i class="fa-solid fa-magnifying-glass" style="color: gray; position: absolute; padding-top: 5px;"></i></button>
        </div>

    <h2>Product Listings</h2>
    <div id="results"></div>

    </div>
</div>

<script>
function searchProducts() {
    let search = document.getElementById("search").value;
    fetch(`/vendor_products?search=${search}`)
        .then(response => response.json())
        .then(data => {
            let resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            data.forEach(product => {
                resultsDiv.innerHTML += `
                    <div style="margin: 10px; padding: 10px; border: 1px solid #000;">
                        <p>Product ID: ${product.ProductID}</p>
                        <p>Product Name: ${product.ProdName}</p>
                        <p>Price: $${product.ProdPrice}</p>
                        <p>Quantity: ${product.ProdQuantity}</p>
                        <p>Description: ${product.ProdDesc}</p>
                        <p>Supplier ID: ${product.SupplierID}</p>
                        <img src="data:image/jpeg;base64,${product.ProdImage}" alt="Product Image" width="100">
                        <br>
                        <button onclick="editProduct(${product.ProductID})">Edit</button>
                    </div>`;
            });
        });
}

function editProduct(productId) {
    window.location.href = `/VendorEditProd/${productId}`;
}
</script>



</body>
</html>
