<script>
	
	function ShowBilling(){
		const checkbox = document.getElementById("BillingSame");
		const BillingAddress = document.getElementById("BillingAddress");
		if (checkbox.checked) {
			BillingAddress.setAttribute("hidden", "true");
		  } else {
			BillingAddress.removeAttribute("hidden");
		  }
	}
	
	function GoToPaySection() {
	const billingSame = document.getElementById("BillingSame").checked;
	const shippingFields = ["Street1", "City", "State", "ZIP"];
	const billingFields = ["BStreet1", "BCity", "BState", "BZIP"];
	for (let id of shippingFields) {
		if (isInputEmpty(id)) {
			alert("Please complete the shipping address before continuing.");
			return;
		}
	}
	if (!billingSame) {
		for (let id of billingFields) {
			if (isInputEmpty(id)) {
				alert("Please complete the billing address before continuing.");
				return;
			}
		}
	} else {
		document.getElementById("BStreet1").value = document.getElementById("Street1").value;
		document.getElementById("BStreet2").value = document.getElementById("Street2").value;
		document.getElementById("BCity").value = document.getElementById("City").value;
		document.getElementById("BState").value = document.getElementById("State").value;
		document.getElementById("BZIP").value = document.getElementById("ZIP").value;
	}
	document.getElementById("PaySection").removeAttribute("hidden");
	document.getElementById("addressSection").setAttribute("hidden", "true");
}
	
	
	function GoToAddressSection(){
		const PaySection = document.getElementById("PaySection");
		const addressSection = document.getElementById("addressSection");
		addressSection.removeAttribute("hidden");
		PaySection.setAttribute("hidden", "true");
	}
	
	function PayType() {
        let InfoDiv = document.getElementById("PaymentInfo");
        if (document.getElementById("Pay").value === "Paypal") {
            InfoDiv.innerHTML = `
				<button type="button" onclick="CompletePayment()">Finish with Paypal</button>
				`;
        } else if (document.getElementById("Pay").value === "Card") {
            InfoDiv.innerHTML =`
				<label for="cname">Name on Card</label>
				<input type="text" id="cname" name="cardname" placeholder="John More Doe" required>
				<label for="ccnum">Credit card number</label>
				<input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" required>
				<label for="expmonth">Exp Month</label>
				<input type="text" id="expmonth" name="expmonth" placeholder="September" required>
				<label for="expyear">Exp Year</label>
                <input type="text" id="expyear" name="expyear" placeholder="2018" required>
				<label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" placeholder="352" required>
				<button type="button" onclick="CompletePayment()">Complete Payment</button>
				`;
        } else {
            InfoDiv.innerHTML = "";
        }
    }
	
	function CompletePayment() {
	const shipo = document.getElementById("shippingSelections");
	console.log(shipo)
    const form = document.getElementById("checkoutForm");
    const formData = new FormData(form);
    fetch(`/checkout`, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Payment successful");
            document.getElementById("main").innerHTML = `<p>
                Order placed successfully!
                </p>
                <p> <a href="/homepage">Back to Home</a></p>`;
        } else {
            alert("Error Completing Payment: " + data.error);
        }
    })
    .catch(error => {
        console.error("Error submitting payment:", error);
        alert("Unexpected error occurred.");
    });
}
	
	function isInputEmpty(inputId) {
		const inputElement = document.getElementById(inputId);
		if (inputElement) {
			return inputElement.value.trim() === '';
		}
		return true; // Return true if the element is not found
	}

	document.addEventListener("DOMContentLoaded", function () {
		const shippingSelections = JSON.parse(localStorage.getItem("selectedShipping") || "{}");
		const grandTotal = localStorage.getItem("grandTotal");
		console.log("Shipping Selections:", shippingSelections);
		console.log("Grand Total:", grandTotal);
		document.getElementById("shippingSelectionsInput").value = JSON.stringify(shippingSelections);
		document.getElementById("grandTotalInput").value = grandTotal;
		document.getElementById("grand-total").textContent = `$${grandTotal}`;
	});
</script>
