<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendors Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
</head>
<body>
<nav>
    <div class="nav-content">
        <div class="logo">
            <img src="{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links" style="float: right">
            <li><a href="{{ url_for('homepage') }}">Back to Home</a></li>
            <li><a href="{{ url_for('search') }}">Search</a></li>
            <li><a href="{{ url_for('login') }}">Logout</a></li>
        </ul>
    </div>
</nav>

<h1 style="padding-top: 50px">Active Orders</h1>

<button onclick="VApproveOrder(0)">Approve All</button>

<div id="ActiveOrder-list">
    <p>Loading orders...</p>
</div>

<div id="ClosedOrder-list">
    <p>Loading orders...</p>
</div>

<script>
    async function loadOrders() {
        const response = await fetch(`/Vhistory`);
        const data = await response.json();

        if (data.length === 0) {
            document.getElementById("ActiveOrder-list").innerHTML = "<p>No recent orders found.</p>";
            document.getElementById("ClosedOrder-list").innerHTML = "<p>No orders found.</p>";
            return;
        }

        function buildTable(title, rows, isActive) {
            let table = `<table border='1'>
                <colgroup>
                    <col style="width: 80px;">
                    <col style="width: 80px;">
                    <col style="width: 200px;"> <!-- Buyer -->
                    <col style="width: 220px;"> <!-- Product -->
                    <col style="width: 100px;">
                    <col style="width: 100px;">
                    <col style="width: 80px;">
                    <col style="width: 100px;">
                    <col style="width: 100px;">
                    <col style="width: 140px;">
                </colgroup>
                <tr>
                    <th>Order Item ID</th>
                    <th>Order ID</th>
                    <th>Buyer</th>
                    <th>Product</th>
                    <th>DateStart</th>
                    <th>DateEnd</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>`;

            rows.forEach(order => {
                const dateEnd = order.DateEnd === null || order.DateEnd === "null" ? "N/A" : order.DateEnd;
                let actions = "No Actions";

                if (order.Status === "Pending") {
                    actions = `<button onclick="VApproveOrder(${order.OrderItemID})">Approve</button><br>
                               <button onclick="VCancelOrder(${order.OrderItemID})">Cancel</button>`;
                } else if (order.Status === "Processing") {
                    actions = `<button onclick="VCancelOrder(${order.OrderItemID})">Cancel</button>`;
                }

                table += `
                    <tr>
                        <td>${order.OrderItemID}</td>
                        <td>${order.OrderID}</td>
                        <td>${order.BuyerName}</td>
                        <td>${order.ProdName}</td>
                        <td>${order.DateStart}</td>
                        <td>${dateEnd}</td>
                        <td>${order.Quantity}</td>
                        <td>$${order.Subtotal.toFixed(2)}</td>
                        <td>${order.Status}</td>
                        <td>${actions}</td>
                    </tr>`;
            });

            table += "</table>";
            return table;
        }

        const activeOrders = data.filter(order => ["Pending", "Processing", "Shipping"].includes(order.Status));
        const closedOrders = data.filter(order => !["Pending", "Processing", "Shipping"].includes(order.Status));

        document.getElementById("ActiveOrder-list").innerHTML = buildTable("Active Orders", activeOrders, true);
        document.getElementById("ClosedOrder-list").innerHTML = buildTable("Closed Orders", closedOrders, false);
    }

    async function VCancelOrder(OrderItemID) {
        const response = await fetch(`/vendor_cancel/${OrderItemID}`, {
            method: 'POST'
        });
        const result = await response.json();
        if (result.success) {
            alert("Order Cancelled successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }

    async function VApproveOrder(OrderItemID) {
        const response = await fetch(`/vendor_approve/${OrderItemID}`, {
            method: 'POST'
        });
        const result = await response.json();
        if (result.success) {
            alert("Order Approved successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }

    window.onload = loadOrders;
</script>

</body>
</html>
