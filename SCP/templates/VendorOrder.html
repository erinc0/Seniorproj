<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Vendors Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
</head>

<body>
<nav style>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links" style="float: right">
            <li><a href="{{url_for('Vhomepage')}}">Back to Home</a></li>
            <li><a href="{{ url_for('search')}}">Search</a></li>
            <li><a href="{{url_for('login')}}">Logout</a></li>
        </ul>
    </div>
</nav>

<h1 style="padding-top: 100px">Active Orders</h1>

<button style="width: 190px; display:flex; justify-self: center; justify-content: center; text-align: center; align-items: center" onclick="VApproveOrder(0)">Approve All</button>
<div id="ActiveOrder-list" action="onload">
    <p>Loading orders...</p>
</div>

<h1 style="padding-top: 100px">Closed Orders</h1>
<div id="ClosedOrder-list" action="onload">
    <p>Loading orders...</p>
</div>

<script>
    async function loadOrders() {
        const response = await fetch(`/Vhistory`);
        const data = await response.json();
        if (data.length === 0) {
            document.getElementById("ActiveOrder-list").innerHTML = "<p>No recent orders found.</p>";
			document.getElementById("ClosedOrder-list").innerHTML = "<p>No orders found.</p>";
            return;
        }
        let ActiveTable = `<table border='1'><tr><th>Order Item ID</th><th>Order ID</th><th>Buyer Name</th>
		<th>Product</th><th>DateStart</th><th>DateEnd</th><th>Quantity</th><th>Subtotal</th>
		<th>Status</th><th>Action</th></tr>`;

        data.forEach(order => {
			console.log(order)
			if (order.Status === ("Pending")){
				ActiveTable += `<tr>
					<td>${order.OrderItemID}</td>
					<td>${order.OrderID}</td>
					<td>${order.BuyerName}</td>
					<td>${order.ProductName || "N/A"}</td>
					<td>${order.DateStart}</td>
					<td>${order.DateEnd || "N/A"}</td>

					<td>${order.Quantity}</td>
					<td>$${order.Subtotal.toFixed(2)}</td>
					<td>${order.Status}</td>
					<td><button onclick="VApproveOrder(${order.OrderItemID})">Approve</button>
					<br><button onclick="VCancelOrder(${order.OrderItemID})">Cancel</button></td>`;
				ActiveTable += "</tr>";
			} else if (order.Status == ('Processing')){
				ActiveTable += `<tr>
					<td>${order.OrderItemID}</td>
					<td>${order.OrderID}</td>
					<td>${order.BuyerName}</td>
					<td>${order.ProductName || "N/A"}</td>
					<td>${order.DateStart}</td>
					<td>${order.DateEnd || "N/A"}</td>
					<td>${order.Quantity}</td>
					<td>$${order.Subtotal.toFixed(2)}</td>
					<td>${order.Status}</td>
					<td><button onclick="VCancelOrder(${order.OrderItemID})">Cancel</button></td>`;
				ActiveTable += "</tr>";
            } else if (order.Status == ('Shipping')){
				ActiveTable += `<tr>
					<td>${order.OrderItemID}</td>
					<td>${order.OrderID}</td>
					<td>${order.BuyerName}</td>
					<td>${order.ProductName || "N/A"}</td>
					<td>${order.DateStart}</td>
					<td>${order.DateEnd || "N/A"}</td>

					<td>${order.Quantity}</td>
					<td>$${order.Subtotal.toFixed(2)}</td>
					<td>${order.Status}</td>
					<td>No Actions available</td>`;
				ActiveTable += "</tr>";
            }
        });
        ActiveTable += "</table>";
        document.getElementById("ActiveOrder-list").innerHTML = ActiveTable;
		
		let ClosedTable = `<table border='1'><tr><th>Order Item ID</th><th>Order ID</th><th>Buyer Name</th>
		<th>Product</th><th>DateStart</th><th>DateEnd</th><th>Quantity</th><th>Subtotal</th>
		<th>Status</th><th>Action</th></tr>`;

        data.forEach(order => {
			if (order.Status !== "Pending" && order.Status !== "Processing" && order.Status !== "Shipping"){
				ClosedTable += `<tr>
					<td>${order.OrderItemID}</td>
					<td>${order.OrderID}</td>
					<td>${order.BuyerName}</td>
					<td>${order.ProductName || "N/A"}</td>
					<td>${order.DateStart}</td>
					<td>${order.DateEnd || "N/A"}</td>

					<td>${order.Quantity}</td>
					<td>$${order.Subtotal.toFixed(2)}</td>
					<td>${order.Status}</td>
					<td>No Actions</td>`;
				ClosedTable += "</tr>";
			}
            
        });
        ClosedTable += "</table>";
        document.getElementById("ClosedOrder-list").innerHTML = ClosedTable;
	}

    async function VCancelOrder(OrderItemID) {
        const response = await fetch(`/vendor_cancel/${OrderItemID}`, {
            method: 'POST'
        });
        const result = await response.json();
        if (result.success) {
            alert("Order Cancelled successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }
	
	async function VApproveOrder(OrderItemID) {
        const response = await fetch(`/vendor_approve/${OrderItemID}`, {
			method: 'POST'
		})
        const result = await response.json();
        if (result.success) {
            alert("Order Approved successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }
	
//
    window.onload = loadOrders;
</script>
<!-- Custom Alert Components -->
<div id="alert-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(3px); z-index:9998;"></div>

<div id="simple-alert" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:2px solid black; padding:25px 40px; z-index:9999; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); border-radius:10px; max-width: 400px;">
    <p id="simple-alert-message" style="margin-bottom: 20px; font-size: 16px;"></p>
    <button onclick="hideSimpleAlert()" style="background-color:#007BFF; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Close</button>
</div>

<script>
    function showSimpleAlert(message) {
        document.getElementById('simple-alert-message').textContent = message;
        document.getElementById('simple-alert').style.display = 'block';
        document.getElementById('alert-overlay').style.display = 'block';
    }

    function hideSimpleAlert() {
        document.getElementById('simple-alert').style.display = 'none';
        document.getElementById('alert-overlay').style.display = 'none';
    }

    window.alert = function(message) {
        showSimpleAlert(message);
    };
</script>

</body>
</html>
