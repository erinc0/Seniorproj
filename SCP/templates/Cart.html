<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
</head>
<body>
    {% include 'topnav.html' %}

<h1>Cart</h1>

<div id="cart-list" onload="Check()">
    <p>Loading Cart...</p>
</div>
<div id="checkout">
	<p> <a href="{{ url_for('checkoutpage') }}"> Checkout </a></p>
</div>
<p> <a href="{{ url_for('Bhomepage') }}"> Back to Buyer Homepage </a></p>

<script>
    async function LoadCart() {
        const response = await fetch(`http://127.0.0.1:5000/cart`);
        const data = await response.json();
		let total = 0;
        if (data.length === 0) {
            document.getElementById("cart-list").innerHTML = "<p>Cart empty.</p>";
			document.getElementById("checkout").innerHTML = `<p> <a href="{{ url_for('search') }}"> Go to search </a></p>`;
            return;
        }else{
			let table = "<table border='1'><tr><th>Product ID</th><th>Image</th><th>Product Name</th><th>Price</th><th>Quantity</th><th>Cost</th><th>Shipping Options</th><th>Actions</th></tr>";
			data.forEach(cart => {
				let shippingOptionsHTML = "<fieldset>";
				cart.ShippingOptions.forEach((opt, index) => {
					shippingOptionsHTML += `
						<label>
							<input type="radio" name="shipping-${cart.ProductID}" value="${opt.ShippingID}" onchange="updateShipping()" ${index === 0 ? 'checked' : ''}>
							${opt.ShippingName} ($${opt.Cost.toFixed(2)})
						</label><br>`;
				});
				shippingOptionsHTML += "</fieldset>";
				let subtotal = cart.ProdPrice * cart.CartQuantity;
				let FormatSubtotal = subtotal.toFixed(2);
				total = total + subtotal;
				table += `<tr>
					<td>${cart.ProductID}</td>
					<td><img src="/get_product_image/${cart.ProductID}" style="width: 100px;height:100px;"></td>
					<td>${cart.ProdName}</td>
					<td>$${cart.ProdPrice.toFixed(2)}</td>
					<td>
						<input type="number" style="width: 50px;"
						id="quantity-${cart.ProductID}" name="quantity" 
						value="${cart.CartQuantity}" min="1" step="1" max="${cart.ProdQuantity}"
						oninput="checkValue(this)">
					</td>
					<td>$${(cart.ProdPrice * cart.CartQuantity).toFixed(2)}</td>
					<td>${shippingOptionsHTML}</td>
					<td>
						<button onclick="updateCart(${cart.ProductID})">Update</button>
						<button onclick="removeFromCart(${cart.ProductID})">Remove</button>
					</td>
				</tr>`;
			});
			table += "</table>";
			document.getElementById("cart-list").innerHTML = table;
			let shippingTotal = 0;
			data.forEach(cart => {
				const firstShipping = cart.ShippingOptions[0];
				if (firstShipping) {
					shippingTotal += firstShipping.Cost;
				}
			});

			let tax = (total + shippingTotal) * 0.06;
			let grandTotal = total + shippingTotal + tax;

			let summaryHTML = `
				<p><strong>Item Subtotal:</strong> $${total.toFixed(2)}</p>
				<p><strong>Shipping:</strong> $${shippingTotal.toFixed(2)}</p>
				<p><strong>Sales Tax (6%):</strong> $${tax.toFixed(2)}</p>
				<p><strong>Grand Total:</strong> $${grandTotal.toFixed(2)}</p>
			`;
			document.getElementById("checkout").innerHTML = summaryHTML + `<p><a href="{{ url_for('checkoutpage') }}"> Checkout </a></p>`;
			return;
		}
	}
	
	function updateShipping() {
		document.getElementById("cart-list").innerHTML = table;
			let shippingTotal = 0;
			data.forEach(cart => {
				const firstShipping = cart.ShippingOptions[0];
				if (firstShipping) {
					shippingTotal += firstShipping.Cost;
				}
			});

			let tax = (total + shippingTotal) * 0.06;
			let grandTotal = total + shippingTotal + tax;

			let summaryHTML = `
				<p><strong>Item Subtotal:</strong> $${total.toFixed(2)}</p>
				<p><strong>Shipping:</strong> $${shippingTotal.toFixed(2)}</p>
				<p><strong>Sales Tax (6%):</strong> $${tax.toFixed(2)}</p>
				<p><strong>Grand Total:</strong> $${grandTotal.toFixed(2)}</p>
			`;
			document.getElementById("checkout").innerHTML = summaryHTML + `<p><a href="{{ url_for('checkoutpage') }}"> Checkout </a></p>`;
	}
	
	function checkValue(sender) {
		let min = sender.min;
		let max = sender.max;
		let value = parseInt(sender.value);
		if (value>max) {
			sender.value = max;
		} else if (value<min) {
			sender.value = min;
		}
	}
	
	async function updateCart(productID) {
        let quantity = document.getElementById(`quantity-${productID}`).value;
        const response = await fetch(`/update_cart/${productID}/${quantity}`, {
            method: "POST"
        });

        const data = await response.json();
        if (data.success) {
            alert("Cart updated!");
            LoadCart(); // Reload the cart to reflect changes
        } else {
            alert("Error: " + data.error);
        }
    }

	async function removeFromCart(productID) {
        const response = await fetch(`/remove_from_cart/${productID}`, {
            method: "DELETE"
        });

        const data = await response.json();
        if (data.success) {
            alert("Item removed from cart!");
            LoadCart(); // Reload the cart to reflect changes
        } else {
            alert("Error: " + data.error);
        }
    }
	
    window.onload = LoadCart;
</script>

</body>
</html>
