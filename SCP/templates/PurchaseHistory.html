<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8">
    <title>Simple Purchase History</title>
	<link rel="stylesheet" href="style.css">
    <style>
      body { font-family: sans-serif; }
      .box { border: 1px solid #ccc; padding: 8px; margin: 5px 0; }
    </style>
  </head>
  <body>
  <img src="estation.png" alt="eStation Logo" width="150">
    <h1>My Purchase History</h1>

    <!-- Simple form to add a purchase -->
    <form action="http://127.0.0.1:5000/history" method="get">
		<input type="text" name="search" required><br><br>
		<button>Load History</button>
	</form>

    <!-- Purchase history list -->
    <div id="history">

    </div>


  </div>

    <!-- Very basic JavaScript to add new purchases -->
    <script>
        async function getHistory() {
            const response = await fetch("http://127.0.0.1:5000/history");
            const data = await response.json();

            let table = "<table border='1'><tr>";
            Object.keys(data[0]).forEach(key => {
                table += `<th>${key}</th>`;
            });
            table += "<th>Actions</th><tr></tr>"

            data.forEach(row => {
                table += "<tr>";
                Object.values(row).forEach(value => {
                    table += `<td>${value}</td>`;
                });

                const OrderID = row['OrderID'];
                table += `<td><button onclick="deleteOrder(${OrderID})" id="button1">Delete</button></td>`;

                table += "</tr>";

            });

            table += "</table>";
            document.getElementById("history").innerHTML = table;
            document.getElementById("cancel").innerHTML = table;

        }
async function deleteOrder(OrderID){
    const response = await fetch(`http://127.0.0.1:5000/cancel/${OrderID}`,{
    method: 'DELETE'
});
    const del = await response.json();
    if (del.success){
    alert('erased');
    await getHistory();
}
        }
window.onload = getHistory();
    </script>

  <p> <a href= "other.html"> Back to Home </a></p>
  <!-- Custom Alert Components -->
<div id="alert-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(3px); z-index:9998;"></div>

<div id="simple-alert" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:2px solid black; padding:25px 40px; z-index:9999; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); border-radius:10px; max-width: 400px;">
    <p id="simple-alert-message" style="margin-bottom: 20px; font-size: 16px;"></p>
    <button onclick="hideSimpleAlert()" style="background-color:#007BFF; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Close</button>
</div>

<script>
    function showSimpleAlert(message) {
        document.getElementById('simple-alert-message').textContent = message;
        document.getElementById('simple-alert').style.display = 'block';
        document.getElementById('alert-overlay').style.display = 'block';
    }

    function hideSimpleAlert() {
        document.getElementById('simple-alert').style.display = 'none';
        document.getElementById('alert-overlay').style.display = 'none';
    }

    window.alert = function(message) {
        showSimpleAlert(message);
    };
</script>

  </body>
</html>
