<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recent Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
    <style>
        button{
            background-color: #1f4291;
            padding:14px 0;
    font-size: 1.3em;
            border-radius: 4px;
            scale: 60%;

        }

    </style>
</head>
<body>
<nav style>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links" style="float: right">
            <li><a href="{{url_for('Bhomepage')}}">Back to Home</a></li>
            <li><a href="{{ url_for('search')}}">Search</a></li>
            <li><a href="{{url_for('login')}}">Logout</a></li>
        </ul>
    </div>
</nav>

<h1 style="padding-top: 110px;padding-bottom: 25px">Recent Orders</h1>

<div id="order-list">
    <p>Loading orders...</p>
</div>
<p> <a href="{{ url_for('Bhomepage') }}"></a></p>
<script>
    async function loadOrders() {
        const buyerID = {{ session['id'] }}; // testing the buyer id you know
        const response = await fetch(`http://127.0.0.1:5000/history?search=${buyerID}`);
        const data = await response.json();

        if (data.length === 0) {
            document.getElementById("order-list").innerHTML = "<p>No recent orders found.</p>";
            return;
        }
        let ordersHTML=`
            <table>
                <thead>
                <tr>
                <th> Order ID</th>
                   <th> Date</th>
                   <th> Status</th>
                   <th> Amount</th>
                      <th> Action</th>
                      </tr>
                      </thead>
                      <tbody>`;



        data.forEach(order => {
            ordersHTML += `<tr>
                        <td>${order.OrderID}</td>

                        <td>${order.DateStart}</td>
                        <td>${order.Status}</td>
                        <td>$${order.Amount.toFixed(2)}</td>`;

            if (order.Status === "Active") {
                ordersHTML += `<td><button onclick="deleteOrder(${order.OrderID})">Cancel</button></td>`;
            } else {
                ordersHTML += `<td><button onclick="alert('Sorry, this order cannot be cancelled due to its status being ${order.Status}. Please contact the help desk.')" disabled>Cannot Cancel</button></td>`;
            }


        });
        ordersHTML+= `</tbody
            </table>`;

        document.getElementById("order-list").innerHTML = ordersHTML;
    }

    async function deleteOrder(OrderID) {
        const response = await fetch(`http://127.0.0.1:5000/cancel/${OrderID}`, {
            method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
            alert("Order deleted successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }
//
    window.onload = loadOrders;
</script>
<!-- Custom Alert Components -->
<div id="alert-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(3px); z-index:9998;"></div>

<div id="simple-alert" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:2px solid black; padding:25px 40px; z-index:9999; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); border-radius:10px; max-width: 400px;">
    <p id="simple-alert-message" style="margin-bottom: 20px; font-size: 16px;"></p>
    <button onclick="hideSimpleAlert()" style="background-color:#007BFF; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Close</button>
</div>

<script>
    function showSimpleAlert(message) {
        document.getElementById('simple-alert-message').textContent = message;
        document.getElementById('simple-alert').style.display = 'block';
        document.getElementById('alert-overlay').style.display = 'block';
    }

    function hideSimpleAlert() {
        document.getElementById('simple-alert').style.display = 'none';
        document.getElementById('alert-overlay').style.display = 'none';
    }

    window.alert = function(message) {
        showSimpleAlert(message);
    };
</script>

</body>
</html>
