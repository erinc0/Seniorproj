<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recent Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homes.css') }}">
</head>
<body>
<nav style>
    <div class="nav-content">
        <div class="logo">
            <img src = "{{ url_for('static', filename='estation.webp') }}" alt="logo"
                 style="width: 130px;height:70px; padding: 10px 4px;">
        </div>

        <ul class="nav-links" style="float: right">
            <li><a href="{{url_for('Bhomepage')}}">Back to Home</a></li>
            <li><a href="{{ url_for('search')}}">Search</a></li>
            <li><a href="{{url_for('login')}}">Logout</a></li>
        </ul>
    </div>
</nav>

<h1 style="padding-top: 50px">Recent Orders</h1>

<div id="order-list">
    <p>Loading orders...</p>
</div>
<p> <a href="{{ url_for('Bhomepage') }}"></a></p>
<script>
    async function loadOrders() {
        const buyerID = {{ session['id'] }}; // testing the buyer id you know
        const response = await fetch(`http://127.0.0.1:5000/history?search=${buyerID}`);
        const data = await response.json();

        if (data.length === 0) {
            document.getElementById("order-list").innerHTML = "<p>No recent orders found.</p>";
            return;
        }

        let table = "<table border='1'><tr><th>Order ID</th><th>Buyer ID</th><th>Date</th><th>Status</th><th>Amount</th><th>Action</th></tr>";

        data.forEach(order => {
            table += `<tr>
                        <td>${order.OrderID}</td>
                        <td>${order.BuyerID}</td>
                        <td>${order.DateStart}</td>
                        <td>${order.Status}</td>
                        <td>$${order.Amount.toFixed(2)}</td>`;
            if (order.Status === "Active") {
                table += `<td><button onclick="deleteOrder(${order.OrderID})">Cancel</button></td>`;
            } else {
                table += `<td><button onclick="alert('Sorry, this order cannot be cancelled due to its status being ${order.Status}. Please contact the help desk.')" disabled>Cannot Cancel</button></td>`;
            }

            table += "</tr>";
        });

        table += "</table>";
        document.getElementById("order-list").innerHTML = table;
    }

    async function deleteOrder(OrderID) {
        const response = await fetch(`http://127.0.0.1:5000/cancel/${OrderID}`, {
            method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
            alert("Order deleted successfully");
            loadOrders();
        } else {
            alert("Error: " + result.error);
        }
    }

    window.onload = loadOrders;
</script>

</body>
</html>
